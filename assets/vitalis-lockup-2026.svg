      <stop offset="0.16" stop-color="#f2c85f"/>
      <stop offset="0.48" stop-color="#d7a936"/>
      <stop offset="0.78" stop-color="#a87316"/>
      <stop offset="1" stop-color="#f0cf7b"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="1">
